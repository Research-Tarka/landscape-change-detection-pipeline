[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "landscape-change-detection-pipeline"
version = "0.1.0"
description = "Satellite-based landscape classification and change detection pipeline (Landsat 5/7/8/9 + Sentinel-2, zarr storage, PyTorch U-Net) producing land-cover classes and time-series change maps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Floors/ceilings only; exact tested pins live in environment.yml and
# requirements-torch.txt (conda-forge is the supported install route for the
# geospatial stack: GDAL/rasterio/pyproj).
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy",
    "scikit-learn",
    "numba>=0.60",
    "joblib",
    "pyarrow",
    "pyyaml",
    "tqdm",
    "pillow",
    "requests",
    "python-dotenv",
    "pydantic>=2",
    "rasterio",
    "rioxarray",
    "xarray",
    "geopandas",
    "shapely",
    "pyproj",
    "affine",
    "zarr>=2.18,<3",
    "numcodecs<0.16",
    "earthengine-api",
    "matplotlib",
    "streamlit",
    "folium",
    "torch",
    "torchvision",
    "segmentation-models-pytorch",
    "transformers",
    "optuna",
    "catboost",
    "lightgbm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `src/` importable without requiring `pip install -e .` first.
pythonpath = ["src"]
markers = [
    "integration: end-to-end pipeline tests (may need network/GEE credentials)",
    "needs_gee: requires working Google Earth Engine credentials",
    "needs_network: requires internet access",
]
