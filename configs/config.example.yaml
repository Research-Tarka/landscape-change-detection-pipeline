# ----------------------------------------------------------------------
# landscape-change-detection-pipeline — example configuration
#
# Copy this file to configs/config.yaml, fill in the CHANGE_ME and
# dollar-brace-VAR placeholders, and point the pipeline at it via --config or
# the LANDSCAPE_CHANGE_DETECTION_CONFIG environment variable. dollar-brace-VAR placeholders
# are substituted from the environment or a .env file (see .env.example).
#
# This is scaffolding: sections are added here
# (tiles, dem, scene_download, features, split, model, train, ...) following
# the pattern documented in src/landscape_change_detection_pipeline/config.py.
# ----------------------------------------------------------------------

# ----------------------------------------------------------------------
# Paths
# All of these must be set to real locations on your machine
# None of these are pipeline parameters.
# ----------------------------------------------------------------------
paths:
  data_root: ${DATA_ROOT}       # root for downloaded raw data (tiles, DEM, scenes)
  output_root: ${OUTPUT_ROOT}   # root for pipeline outputs (inference maps, composites, stats)
  model_root: ${MODEL_ROOT}     # root for trained model checkpoints

# ----------------------------------------------------------------------
# Google Earth Engine
# ----------------------------------------------------------------------
gee:
  project: ${EE_PROJECT}
  # Full pool of Earth Engine Cloud projects available for quota spreading.
  # Any step that can spread
  # work across multiple GEE projects defaults to round-robining over this
  # pool when its own per-step project list (e.g. scene_download.ee_projects)
  # is left empty -- list your projects once, here.
  projects: []                         # e.g. [my-project-1, my-project-2, ...]

# ----------------------------------------------------------------------
# AOI tiling
# ----------------------------------------------------------------------
tiles:
  aoi_path: CHANGE_ME                  # path to your AOI GeoPackage
  aoi_layer: output
  aoi_crs: EPSG:26910
  tile_size_m: 8000.0        # square tile side, before buffering (metres)
  buffer_m: 250.0            # edge buffer added to each tile's analysis window (metres)
  pilot_bbox: null           # optional [minx, miny, maxx, maxy] in aoi_crs, to restrict to a pilot sub-area
  # By default pilot_bbox must overlap the AOI polygon (raises otherwise). Set to
  # false to tile pilot_bbox as a standalone window when it's deliberately outside
  # the tracked AOI (e.g. a separate study zone not yet added to the AOI gpkg).
  pilot_bbox_requires_aoi_overlap: true
  # Prepended to every generated tile_id ("tile_0000_0000" -> "<prefix>_tile_0000_0000").
  # tile_id is just a row/col index into YOUR OWN AOI grid -- two people tiling
  # different AOIs will independently produce the same tile_0000_0000, which
  # silently collides (one overwrites the other) the moment training caches are
  # merged into a shared data/train_cache/. Set this to something unique per
  # contributor/project (e.g. your initials) BEFORE running 01_build_tiles.py if
  # you ever intend to share/merge training data -- it cannot be changed after
  # the fact without redoing every downstream stage.
  tile_id_prefix: ""                   # e.g. "projectA"
  registry_path: data/tiles/tile_registry.parquet
  n_splits: 1                # number of parallel GEE projects/workers to distribute tiles across
  split_assignment_path: data/tiles/split_assignment.parquet

# ----------------------------------------------------------------------
# Per-tile DEM acquisition
# ----------------------------------------------------------------------
dem:
  tile_dir: data/tiles                 # holds <tile_id>.zarr, one per tile
  use_copernicus_fallback: true        # fall back to Copernicus GLO-30 if MRDEM-30 has no coverage
  force_copernicus: false              # debug/test switch: skip MRDEM entirely

# ----------------------------------------------------------------------
# GEE scene search/download
# AOI filtering reuses tiles.aoi_path/aoi_layer/aoi_crs above; a scene is
# searched per tile window, not globally.
# ----------------------------------------------------------------------
scene_download:
  date_start_mmdd: "01-01"             # whole-year coverage by default (not a fixed season)
  date_end_mmdd: "12-31"
  max_cloud_pct: 30.0                  # per-sensor cloud property: CLOUD_COVER (Landsat) / CLOUDY_PIXEL_PERCENTAGE (Sentinel-2)
  max_scenes_per_tile_month: null      # cap on scenes kept per sensor per tile per calendar month; null = unlimited
  min_aoi_coverage_pct: 75.0           # reject scenes whose footprint covers less than this % of the tile's search bbox
  min_plausible_reflectance: 0.15      # reduceRegion(minMax()) sanity check; below this looks like edge-of-swath fill
  cache_dir: data/scenes/cache         # per-split SQLite-WAL resume caches

  # Orchestration: one GEE project per split (index-aligned with
  # tiles.n_splits), each run in its own subprocess for real quota spreading.
  ee_projects: []                      # e.g. [project-split0, project-split1, ...]
  tile_workers: 1                      # tiles processed concurrently per split (real processes, never threads)
  tile_work_timeout_s: 1800            # per-tile timeout before a stalled worker is killed and reassigned
  run_all_splits: false                # true = scripts/03_download_scenes.py with no CLI flags runs every split in parallel (like --split all --parallel)

# ----------------------------------------------------------------------
# Topographic (illumination) correction -- disabled: per-pixel SCS+C ratio
# noise (from DEM slope/aspect at pixel level) produces visible blotchy
# artifacts in RGB composites even with the ratio clipped and a single
# scene-wide C shared across bands. Re-enable only after further tuning.
# ----------------------------------------------------------------------
topographic_correction:
  enabled: false

# ----------------------------------------------------------------------
# Spectral indices and annotation-to-training-cache export
# ----------------------------------------------------------------------
features:
  train_root: data/train_cache          # one .npz/.json cache pair per annotated scene
  mask_root: data/masks                 # MaskForge's SaveConfig.output_root -- {tile_id}_{sensor}_{scene_id}/mask.tif
  # Where scripts/export_georeferenced_cache.py writes standalone georeferenced
  # GeoTIFFs (features.tif + labels.tif per scene) reconstructed from train_root.
  # This is the folder you zip/copy to hand training data to someone else, or
  # to open a scene+mask in QGIS for a visual check -- no knowledge of this
  # pipeline needed to use it.
  geotiff_export_root: data/train_geotiff
  pseudo_geotiff_export_root: data/pseudo_label_geotiff

  # Spectral input variables, in model-input order. Active = plain line,
  # available-but-off = commented with #. Changing this changes the model's
  # input channel count: re-export the cache (04) and retrain (05).
  index_names:
    - NDVI                # (nir - red) / (nir + red)
    - NDSI                # (green - swir1) / (green + swir1)  [= MNDWI]
    - NDWI_GAO            # (nir - swir1) / (nir + swir1)      [= -NDBI]
    - NBR                 # (nir - swir2) / (nir + swir2)
    - ND_SWIR1_SWIR2      # (swir1 - swir2) / (swir1 + swir2)  [= NBR2]
    - ND_BLUE_RED
    - ND_BLUE_NIR
    - ND_GREEN_RED
    - r                   # chromaticity red / (r+g+b)
    - g
    - b
    - BSI                 # bare soil index: bare/sand/rock/built vs vegetation
    - NDWI_MCFEETERS      # (green - nir) / (green + nir): open water
    - EVI                 # enhanced vegetation index (dense canopy, aerosols)
    - TC_BRIGHTNESS       # Tasseled Cap, per-sensor coefficients (L5/L7/L8/L9/S2)
    - TC_GREENNESS
    - TC_WETNESS
    # - NDBI              # redundant: exactly -NDWI_GAO
    # - SAVI              # soil-adjusted vegetation index (arid); overlaps EVI/NDVI
  dem_layer_names: [elevation, slope, aspect]

  # Extra scene-wide channels appended after the DEM layers, so the model
  # sees seasonality/geography directly instead of that being folded into
  # the class taxonomy (configs/classes.yaml) or left for the model to infer
  # from spectral signal alone. Both default to true. Changing either
  # changes the model's input channel count -- re-export the training cache
  # (scripts/04_export_training_cache.py) and retrain (scripts/05_train_model.py)
  # after changing.
  include_doy_features: true            # adds doy_sin/doy_cos (cyclical day-of-year, from each scene's acquisition date)
  include_latlon_features: false        # adds lat_norm/lon_norm (each scene's centroid, normalized to roughly [-1, 1])

# ----------------------------------------------------------------------
# Train/val/test split
# ----------------------------------------------------------------------
split:
  ratios: [0.7, 0.15, 0.15]             # [train, val, test], must sum to 1.0
  split_seed: 0                         # seeded stratified shuffle -> reproducible split
  split_by: scene                       # tile (default, leakage-safe) | scene -- scene allows scenes from the same tile to land in different partitions
  drift_tolerance: 0.25                 # warn (never fail) if a partition's actual ratio drifts more than this fraction of target
  split_assignment_path: data/train_cache/split_assignment.json

# ----------------------------------------------------------------------
# Model selection
#
# `type` is the ONE switch that picks which model actually trains/runs --
# scripts/05_train_model.py and scripts/06_run_inference.py both dispatch on
# this single field. Every sub-section below (threshold/random_forest/
# catboost/unet/deeplabv3plus/segformer) is always present and always read by
# pydantic, but only the one matching `type` is ever actually used --
# the others are simply ignored, so you can keep tuned settings for more
# than one model type around at once without deleting anything. To switch
# models: change `type` to one of the seven values below, nothing else.
#
#   type: threshold       -- Optuna-tuned per-band spectral-index thresholds
#                             (cheapest, no GPU, good sanity-check baseline)
#   type: random_forest    -- sklearn RandomForestClassifier on the flattened
#                             per-pixel feature stack (no GPU needed, but no
#                             incremental fit either -- the full dense pixel
#                             matrix must fit in RAM at once; prefer lightgbm
#                             below on a large corpus, see its own note)
#   type: catboost          -- gradient-boosted trees (GPU by default, see
#                             catboost.task_type below)
#   type: lightgbm           -- histogram-based gradient-boosted trees (CPU by
#                             default, see lightgbm.device below); the
#                             RAM-conscious alternative to random_forest on a
#                             large training corpus (no full dense matrix kept
#                             resident once LightGBM's own Dataset is built)
#   type: unet               -- this project's primary model: a U-Net over
#                             (patch_size x patch_size) image patches (GPU)
#   type: deeplabv3plus      -- DeepLabv3+ (segmentation_models_pytorch ResNet
#                             encoder, ASPP + low-level-feature decoder) baseline
#                             for comparison against the U-Net (GPU)
#   type: segformer           -- SegFormer (HuggingFace MiT backbone) baseline
#                             for comparison against the U-Net (GPU)
# ----------------------------------------------------------------------
model:
  type: unet

  # -- type: threshold -----------------------------------------------------
  threshold:
    n_trials: 200                       # Optuna study size
    sampler: tpe                        # tpe (Bayesian) | grid (exhaustive grid search)
    timeout_s: null                     # optional wall-clock cap on the whole study (seconds); null = no cap
    study_storage: null                 # null = in-memory only; or e.g. "sqlite:///threshold_study.db" to resume/inspect later

  # -- type: random_forest --------------------------------------------------
  random_forest:
    n_estimators: 300
    max_depth: null                     # null = unlimited depth
    n_jobs: -1                          # -1 = use all available CPU cores
    class_weight: balanced              # balanced | null (classes here are far from evenly represented)
    random_state: 0

  # -- type: catboost ---------------------------------------------------------
  catboost:
    iterations: 1000                    # final refit's upper bound; early_stopping_rounds usually stops sooner
    learning_rate: 0.05
    depth: 8
    task_type: GPU                      # GPU | CPU -- set to CPU on a machine without a CUDA GPU
    random_state: 0
    early_stopping_rounds: 50           # final refit only
    class_weighting: true               # inverse-frequency class weights -- rare classes learn poorly without this
    # n_trials > 0 runs an Optuna search (learning_rate, depth, l2_leaf_reg):
    # each trial is fit cheaply at search_iterations, then the winning
    # params are refit once at this section's own `iterations` (the real,
    # full budget) -- "lots of cheap trials, then one real run" in one knob.
    # n_trials: 30
    # sampler: tpe                      # tpe | cmaes | random
    # pruner: none                      # none | median | hyperband -- hyperband cuts a bad
    #                                    # trial early from its per-round eval-set loss.
    #                                    # CPU only: CatBoost supports neither pruning
    #                                    # callbacks nor resumable fitting on GPU, so with
    #                                    # task_type=GPU every trial still runs to completion
    #                                    # regardless of this setting (a warning is logged).
    # search_iterations: 500            # per-trial cap during the search (keep low: cheap exploration)
    # search_early_stopping_rounds: 30

  # -- type: lightgbm -----------------------------------------------------
  # device: cpu is the confirmed-working default -- the standard `pip install
  # lightgbm` wheel has no GPU/CUDA tree learner built in (confirmed live: both
  # fail with "Tree Learner was not enabled in this build"). gpu/cuda need a
  # from-source LightGBM build (cmake -DUSE_GPU=1 / -DUSE_CUDA=1); only switch
  # this after re-confirming that build actually works on your machine.
  lightgbm:
    num_leaves: 31
    learning_rate: 0.05
    n_estimators: 1000                  # final refit's upper bound; early_stopping_rounds usually stops sooner
    max_depth: -1                       # -1 = unlimited depth
    min_data_in_leaf: 20
    device: cpu                         # cpu | gpu | cuda -- see note above
    random_state: 0
    early_stopping_rounds: 50           # final refit only
    class_weighting: true               # inverse-frequency class weights -- rare classes learn poorly without this
    # n_trials > 0 runs an Optuna search (learning_rate, num_leaves,
    # min_data_in_leaf): each trial is fit cheaply at search_n_estimators,
    # then the winning params are refit once at this section's own
    # `n_estimators` (the real, full budget), scored by macro mIoU on val_records:
    # n_trials: 30
    # sampler: tpe                      # tpe | cmaes | random
    # pruner: none                      # none | median | hyperband -- hyperband cuts a bad
    #                                    # trial early from its per-round eval-set metric
    # search_n_estimators: 500          # per-trial cap during the search (keep low: cheap exploration)
    # search_early_stopping_rounds: 30

  # -- type: unet ---------------------------------------------------------
  unet:
    base_ch: 48                         # first encoder stage's channel width (doubles each of the 3 deeper stages)
    dropout_p: 0.0
    use_spatial_context: false          # FiLM-conditions the first encoder stage on (x, y, year_norm, area_norm)
    use_sensor_film: false              # only has an effect when training on more than one sensor at once
    norm_type: batch                    # batch | group -- group is incompatible with multi-sensor training
    bottleneck_attention: false         # self-attention over the bottleneck grid
    bottleneck_attention_heads: 8       # only read when bottleneck_attention is true
    deep_supervision: false             # auxiliary decoder-level logit heads, training-time only

  # -- type: deeplabv3plus -----------------------------------------------------
  deeplabv3plus:
    backbone: resnet50                  # ResNet encoder variant (segmentation_models_pytorch)
    pretrained: true                    # load ImageNet-pretrained backbone weights before replacing the input stem
    dropout_p: 0.1

  # -- type: segformer -----------------------------------------------------
  segformer:
    variant: mit-b0                     # mit-b0 (smallest) through mit-b5 (largest) -- HuggingFace MiT encoder size
    pretrained: true                    # load pretrained encoder weights before replacing the input stem
    dropout_p: 0.1

# ----------------------------------------------------------------------
# Training loop
# Only used for the torch model types (unet/deeplabv3plus/segformer) --
# threshold/random_forest/catboost fit directly via their own .fit() call,
# not this epoch-based loop.
# ----------------------------------------------------------------------
training:
  epochs: 100
  batch_size: 32
  patch_size: 256                       # must be <= the smallest tile's grid size for that sensor, or scenes get reflect-padded up to it
  lr: 0.0003
  weight_decay: 0.0001
  patience: 30                          # epochs without improvement before early stopping
  num_workers: 16                       # CPU-bound data loading is the bottleneck (GPU 20-30%, CPU ~90% even at num_workers=10) -- raise toward core count minus a couple reserved for the main process, watch RAM (each worker holds its own copy of every loaded scene)
  seed: 0
  deterministic: false                  # true pins cuDNN to deterministic algorithms (slower, exactly reproducible)
  amp: true                             # mixed precision (only takes effect on CUDA)
  grad_clip_norm: 1.0
  main_iou_metric: miou_macro           # miou_macro | miou_weighted | miou_inv_freq -- drives early stopping
  augment_flips: true
  augment_rotate90: true
  # Merge classes (source: target, names from classes.yaml). Source pixels are
  # relabelled as the target when scenes are read (caches on disk untouched);
  # predictions of a source class are folded onto the target at evaluation,
  # pseudo-labeling and inference. Also remove merged classes from the
  # rare_classes lists below (a warning is printed otherwise). {} = off.
  class_merge:
    built_up_infrastructure: bare_ground   # 1-2 px objects: below sensor resolution, never learned
  class_weighting: true                 # inverse-frequency class weights in the loss -- rare classes learn poorly without this
  class_weight_power: 0.5               # weight = inverse_freq ** power; 1.0 = plain (can reach x100+ and break training), 0.5 = sqrt
  class_weight_max: 10.0                # cap on any single class weight; null = no cap
  focal_gamma: 0.0                      # focal loss: 0 = off, 2 = usual. Focuses the gradient on hard/rare pixels
  dice_weight: 0.0                      # soft-Dice term added to the loss: 0 = off, 0.5-1.0 typical. Every class counts equally
  checkpoint_dir: models/checkpoints
  # Optional directional confusion penalties added to the loss, e.g. to
  # extra-penalize predicting "open_water" (class 7) wherever the truth is
  # "wetland_riparian_marsh" (class 6). Leave empty until real confusion
  # patterns are observed in early training runs (see
  # training.losses.ConfusionPenalty). true_class: null means "any class
  # other than predicted_class".
  confusion_penalties: []               # e.g. [{true_class: 6, predicted_class: 7, beta: 1.0}]

  # Radiometric jitter (per-patch brightness/contrast shift + per-pixel
  # Gaussian noise) applied only to the spectral-index channels of a
  # training patch -- never to DEM/day-of-year/lat-lon channels, which have
  # no radiometric meaning. Off by default; on top of the geometric
  # augmentation (augment_flips/augment_rotate90) above when enabled.
  radiometric_augmentation:
    enabled: false
    brightness_std: 0.05                # additive jitter std, in normalized (post train mean/std) units
    contrast_std: 0.05                  # multiplicative jitter std around each channel's own mean
    noise_std: 0.02                     # i.i.d. Gaussian pixel noise std, same normalized units

  # Class-driven per-scene oversampling: draws a scene more often in
  # proportion to its share of rare-class pixels, without changing the
  # per-pixel loss (unlike class_weighting) or the natural class mix inside
  # a drawn patch. A gentler alternative to try first if class_weighting has
  # destabilized training (see TrainingConfig's own docstring).
  scene_oversampling:
    enabled: false
    rare_class_threshold: 0.02          # a class below this corpus-wide pixel share counts as "rare"
    boost_factor: 5.0                   # a scene made entirely of rare-class pixels is drawn (1+this) times as often
    rare_classes: [5, 7, 9]             # DENSE ids: open_water, burned_disturbed, ice_cover; [] = use rare_class_threshold (never list a class merged by class_merge)
    presence_min_pixels: 0              # e.g. 2000: a scene with >= this many rare pixels counts as fully rare (else share is tiny)

  # Semi-supervised self-training over the large unlabeled scene pool under
  # dem.tile_dir (data/tiles is typically far bigger than what fits in RAM,
  # hence a separate streaming script rather than loading it like
  # train_root). Workflow: train once normally, run
  # scripts/05b_generate_pseudo_labels.py against that checkpoint to write
  # confidence-thresholded pseudo-labels to pseudo_label_root, then set
  # enabled: true and retrain/fine-tune -- pseudo-labeled scenes are mixed
  # into training at reduced sampling and loss weight.
  pseudo_label:
    enabled: false
    pseudo_label_root: data/pseudo_label_cache
    confidence_threshold: 0.9           # only pixels with max-softmax >= this are kept as pseudo-labels
    max_scenes: null                    # cap how many unlabeled scenes to score per run; null = no cap
    sensors: null                       # restrict pseudo-labeling to these sensors, e.g. [l8, s2]; null = all
    inference_batch_size: 32            # patches per inference batch when streaming an unlabeled scene
    inference_stride: null              # null = patch_size (no overlap, ~4x faster); set e.g. 128 for smoother output
    use_amp: true                       # fp16 autocast on GPU
    prefetch_workers: 3                 # threads preloading next scenes while the GPU infers
    rare_classes: [5, 7, 9]             # DENSE ids to favour (never list a class merged by class_merge)
    rare_confidence_threshold: 0.7      # lower threshold applied to rare classes
    min_rare_pixels: 500                # keep a scene with >= this many rare pixels even if few pixels pass overall
    pseudo_label_weight: 0.3            # pseudo-labeled scenes are drawn at this fraction of a real scene's rate
    pseudo_label_loss_weight: 0.5       # scales a pseudo-labeled patch's contribution to the loss

# ----------------------------------------------------------------------
# Optuna HPO
# Only used for the torch model types. trials: 0 (default) skips the search
# entirely and trains once at training's own hyperparameters above --
# appropriate once those values are already tuned, or for a quick test.
# trials: N runs N short trials (trial_epochs each) over search_space, then
# retrains once at full length with the winning hyperparameters.
#
# search_space keys must be hyperparameters training/hpo.py actually knows
# how to apply (see its _TRAINING_FIELDS/_MODEL_SUBSECTION_FIELDS tables) --
# an unrecognised name raises immediately rather than being silently
# ignored. Deliberately excludes patch_size/stride/batch_size from the
# *default* space: varying those changes what a trial even measures
# (different effective receptive field / tile population), making trials
# incomparable -- only add them yourself if you specifically intend that.
# ----------------------------------------------------------------------
hpo:
  trials: 0
  trial_epochs: 25
  sampler: tpe                          # tpe | cmaes | random
  pruner: none                          # none | median | hyperband
  storage: null                         # null = in-memory; or e.g. "sqlite:///hpo_study.db" to resume/inspect later
  search_space:
    lr:
      type: log_uniform                 # log_uniform | uniform
      bounds: [0.00001, 0.01]
    weight_decay:
      type: log_uniform
      bounds: [0.000001, 0.01]
    dropout_p:
      type: uniform
      bounds: [0.0, 0.5]

# ----------------------------------------------------------------------
# Multi-seed bootstrap ensembling
# Trains bootstrap.n_seeds models (each seed optionally HPO-tuned per the
# hpo section above), varying only the random seed -- never split.split_seed
# -- and reports mean +/- population std across seeds. When enabled, this
# REPLACES the single training run scripts/05_train_model.py otherwise does.
# ----------------------------------------------------------------------
bootstrap:
  enabled: false
  n_seeds: 5
  seed_base: 0
  create_ensemble: true                 # also writes every seed's weights side by side for softmax-averaged ensemble inference

# ----------------------------------------------------------------------
# Sliding-window inference
# ----------------------------------------------------------------------
inference:
  patch_size: 256                       # usually matches training.patch_size
  stride: 128                           # smaller stride = more overlap = smoother seams but slower
  batch_size: 32
  scene_precheck_min_valid_ratio: 0.30  # skip a scene below this finite-pixel fraction
  overwrite: false
  output_root: outputs/inference
  # Ambiguity tie-break: below this top-two softmax confidence gap, the
  # class_priority_order below wins instead of a plain argmax. 0/null = plain
  # argmax always (default -- no calibration study has been run yet for this
  # project).
  ambiguity_threshold: null
  class_priority_order: []              # empty = use the built-in default order (see inference/engine.py::DEFAULT_CLASS_PRIORITY_ORDER); or e.g. [7, 6, 8, 11, 9, 10, 5, 4, 3, 0, 1, 2, 12, 13] to override
  checkpoint_path: null                  # null = <training.checkpoint_dir>/<model.type>_best.<pt|joblib>
  tiles: []                              # empty = every tile in the registry
  sensors: []                            # empty = every sensor (l5, l7, l8, l9, s2)
  device: null                           # null = auto-detect (cuda if available, else cpu)
  # Worker processes for scripts/06_run_inference.py (feature-stack build +
  # inference, parallelized per scene). 1 = sequential. Keep this small for a
  # GPU-backed model type (e.g. catboost with task_type=GPU) -- concurrent
  # processes contend for the same GPU past a point instead of adding real
  # throughput -- and raise it gradually while comparing wall-clock time
  # rather than jumping straight to the machine's full core count.
  workers: 1

# ----------------------------------------------------------------------
# Monthly composites
# ----------------------------------------------------------------------
composites:
  sensor_resolution_priority: [s2, l9, l8, l7, l5]
  default_rule: median                  # median | any_occurrence | fallback_occurrence, per class_id below
  # Per-class override of default_rule. class_id values below match this
  # project's own configs/classes.yaml -- adjust to your own taxonomy.
  class_rules:
    - class_id: 9   # ice_cover: transient, fills in only if nothing else won the month's majority; beats snow
      rule: fallback_occurrence
      priority: 1
    - class_id: 8   # snow_cover: transient, fills in only if nothing else won the month's majority
      rule: fallback_occurrence
      priority: 2
  output_root: outputs/composites
  tiles: []                              # empty = every tile in the registry
  overwrite: false
  workers: 1                             # CPU-only, no GPU contention here -- can scale close to core count

# ----------------------------------------------------------------------
# AOI-wide mosaicking
# Crop-and-place: each tile's monthly composite is cropped to its own
# unbuffered search_bbox (discarding tiles.buffer_m), then placed onto one
# continuous raster per period. Per-period output resolution is decided
# automatically -- the finest resolution_m achieved by any tile that period,
# coarser tiles nearest-neighbour-resampled up to it. Nothing to tune here
# besides where the output goes.
# ----------------------------------------------------------------------
mosaic:
  output_root: outputs/mosaics
  periods: []                            # empty = every period with at least one tile composite
  overwrite: false
  workers: 1                             # CPU-only, no GPU contention here -- can scale close to core count

# ----------------------------------------------------------------------
# Per-pixel temporal segmentation (break dates, trends, seasonality)
# Runs entirely locally on this pipeline's own stored, already-classified
# scenes. Splits every pixel's multi-decade time series of the configured
# spectral indices into stable segments separated by detected breaks; each
# segment carries its fitted level/trend/seasonal amplitude/peak-day per
# feature and its dominant land-cover class.
# ----------------------------------------------------------------------
change_detection:
  output_root: outputs/change_detection
  tiles: []                              # empty = every tile in the registry
  overwrite: false
  start_year: 1984                       # earliest observation year to include
  end_year: null                         # null = up to the latest stored scene
  # Spectral indices the time series is built from (features.spectral_indices/
  # change.analysis_indices names) -- NBR and NDVI are required (burn severity
  # and vegetation-state layers read them directly).
  features: [NBR, NDVI, NDWI_GAO, TC_BRIGHTNESS]
  # Classes whose observations are excluded entirely (not usable land-surface
  # signal, not "changed").
  masked_classes: [cloud, shadow, snow_cover, ice_cover, open_water]
  p_change: 0.999                         # chi-square probability level of the per-observation change test
  conse: 4                               # consecutive exceeding observations required to confirm a break
  init_obs: 18                           # minimum clear observations in a segment's initial window
  init_min_span_days: 365                # minimum calendar span (days) of the initial window
  stability_threshold: 3.0               # max trend/end-residual (in residual std devs) for the initial window to be accepted
  min_rmse: 0.03                         # floor on each feature's residual scale (index units)
  max_harmonics: 3                       # 1-3, seasonal model complexity (grows with segment length automatically, capped here)
  outlier_p: 0.999999                    # probability level above which an isolated init-window observation is dropped
  max_segments: 16                       # cap on segments per pixel
  min_magnitude: 0.1                     # keep a confirmed break only if the shift reaches this on one of magnitude_features (0 = off)
  magnitude_features: [NBR, NDVI]
  min_break_span_days: 45                # confirming run must also span this many days (0 = off)
  refit_every: 3                         # refit the model every N accepted observations (1 = always)
  aggregate_days: 15                     # bin observations per sensor into N-day medians before segmenting (0 = off; 30 = monthly)
  season_window: [152, 258]              # only use observations in this day-of-year range (~1 Jun-15 Sep); [] = whole year
  min_magnitude_same_class: 0.2          # stricter min_magnitude when the class does not change across the break
  persist_days: 300                      # the shift must still show >= this many days after the break (0 = off)
  min_obs_break_year: 8                  # usable observations required within a year of a break (0 = off)
  block_rows: 50                         # row-block height of the temporary scene cube (memory per block scales with it)
  # Scenes decoded concurrently while building the cube -- this is a thin
  # thread pool around zarr reads (I/O/decompression-bound, not CPU-bound),
  # so it scales usefully well past your core count. Measured on real pilot
  # data (811 scenes, 24-core machine): 4 -> 20 threads cut the read pass
  # from ~22s to ~17s. The much bigger cost (~80% of a tile's total time) is
  # the per-pixel Numba segmentation pass below, which this does not touch.
  io_threads: 20
  numba_threads: 0                       # 0 = use every core for the per-pixel segmentation pass

# ----------------------------------------------------------------------
# Per-pixel, per-water-year snow/ice/open-water summaries
# Reads Stage 7's monthly class composites directly (the classifier's own
# snow_cover/ice_cover/open_water class) -- a categorical signal, distinct
# from change_detection's continuous vegetation-index trend model above,
# which excludes these same classes for the opposite reason.
# ----------------------------------------------------------------------
snow_water_dynamics:
  output_root: outputs/snow_water_dynamics
  tiles: []                              # empty = every tile in the registry
  overwrite: false
  water_year_start_month: 10             # 1-12; 10 = October (Water Survey of Canada's standard water-year start)
  # Unlike change_detection, this stage does no internal multi-core work of
  # its own -- tiles are fully independent, so this benefits from
  # inter-tile parallelism the way mosaic.workers does. mosaic.workers=16
  # froze the machine once (see mosaic's own comment above); this stage is
  # far lighter per tile (no full-tile numpy array kept resident), so a
  # higher value is more defensible here, but still watch memory the first
  # time you raise it on a new machine.
  workers: 16

# ----------------------------------------------------------------------
# NDVI regrowth trajectory / dNBR burn severity
# No NDSI snow filter here by design -- snow/ice/water dynamics are tracked
# separately by snow_water_dynamics above, from the same classifier output.
# ----------------------------------------------------------------------
regrowth_severity:
  output_root: outputs/regrowth_severity
  tiles: []                              # empty = every tile in the registry
  overwrite: false
  workers: 16                           # see snow_water_dynamics.workers's own comment above
  month_threads: 4                      # monthly composites computed this many months ahead in threads inside a tile (1 = sequential)

# ----------------------------------------------------------------------
# Persistent land-cover object tracking (agriculture, cutblock, built-up,
# burned/regrowth) -- appearance/end month per pixel, not just a per-month
# state. burned_disturbed reuses change_detection's own break date as its
# appearance month rather than being detected purely from the monthly
# composite majority vote the other tracked classes use.
# ----------------------------------------------------------------------
landcover_persistence:
  output_root: outputs/landcover_persistence
  tiles: []                              # empty = every tile in the registry
  overwrite: false
  workers: 16                           # see snow_water_dynamics.workers's own comment above
  tracked_classes: [burned_disturbed]   # only classifier states that persist; uses (cutblock, cropland, built) are named by event_typing
  window_size: 5                        # observed months in the sliding majority-vote window
  min_fraction: 0.8                      # >= this fraction of the last window_size OBSERVED months must show the class to start it
  end_fraction: 0.2                      # ... and <= this fraction to end it (hysteresis)
  masked_classes: [cloud, shadow, snow_cover, ice_cover]   # unobserved months: skipped by the vote
  default_min_duration_months: 12        # drop intervals shorter than this
  min_duration_months: {}                # per-class override, e.g. {burned_disturbed: 6}
  require_break_classes: [burned_disturbed]  # need a Stage 09 break (NBR/NDVI fall) at the start
  break_tolerance_months: 18
  break_after_months: 6
  min_break_drop: 0.1

# ----------------------------------------------------------------------
# Combined annual / month-to-month change maps
# Three classification-change confidence bands, kept separate on purpose:
# raw (noisy but immediate), persistent (confirmed over follow-up months),
# corroborated (confirmed by a nearby segmentation break).
# ----------------------------------------------------------------------
change_maps:
  persistence_periods: 1                # follow-up months required to confirm a "persistent" change
  corroboration_window_days: 45         # max days between a compared-period boundary and a segmentation break to corroborate
  output_root: outputs/change_maps
  tiles: []                              # empty = every tile in the registry
  overwrite: false
  workers: 16                           # see snow_water_dynamics.workers's own comment above

# ----------------------------------------------------------------------
# Naming change events from the detected states (script 12): fire, cutblock
# (duration + forest recovery), permanent clearing (road/pad/mine/built candidate),
# canopy decline, cropland (annual bare/grass cycle). Uses are read from the behaviour of the
# surface-state classes, they are not classes.
# ----------------------------------------------------------------------
event_typing:
  output_root: outputs/change_events
  tiles: []                             # empty = every tile in the registry
  overwrite: false
  forest_class: forest
  grass_class: grassland_herbaceous
  bare_class: bare_ground
  burned_class: burned_disturbed
  masked_classes: [cloud, shadow, snow_cover, ice_cover]   # unobserved months: skipped
  min_drop: 0.15                        # NBR/NDVI fall that makes a break a loss
  min_fraction: 0.8                     # >= this forest share of a season = forest (before / recovered)
  end_fraction: 0.2                     # <= this forest share of a season = cleared
  burn_min_fraction: 0.4                # burned share of the cleared seasons that makes it a fire
  cutblock_season: [5, 10]              # months (May-October) the cutblock rule looks at
  min_season_obs: 2                     # observed months a season needs to count
  pre_seasons: 2                        # forest in this many observed seasons before the break
  min_cleared_years: 3                  # not forest for this many seasons in a row (forest takes years to come back)
  permanent_years: 8.0                  # cleared, never recovered, mostly bare for this long = permanent clearing
  permanent_bare_fraction: 0.6
  crop_season: [5, 10]                  # months (May-October) bare and grass must roll through
  crop_min_months_per_year: 2           # observed months of EACH of bare and grass in that season = a cycling year
  crop_min_run_years: 4                 # cycling EVERY observed year from its first year to the end of the series, for at least this many years = cropland
  crop_allowed_gaps: 0                  # observed years allowed not to cycle (0 = strictly every year)
  crop_max_forest_fraction: 0.0         # forest share allowed from the start year on (0 = never forest again)

# ----------------------------------------------------------------------
# Vegetation dynamics (script 14): what the vegetation does BETWEEN breaks.
# One monthly index cube per tile (temporary, on disk), then per pixel:
# phenology, slow trends, monthly anomalies, interannual variability.
# Every element has its own `enabled`.
# ----------------------------------------------------------------------
vegetation_dynamics:
  enabled: true
  output_root: outputs/vegetation_dynamics
  tiles: []                             # empty = every tile in the registry
  overwrite: false
  workers: 4                            # tiles in parallel; memory per worker = the yearly output arrays (a few hundred MB per 8 km tile)
  month_threads: 4                      # months of the cube built ahead in threads inside a tile (1 = sequential)
  block_rows: 64                        # rows per block of the per-pixel pass (smaller = less RAM)
  indices: [NDVI]                       # one cube + one set of outputs per index (NBR also possible; costs disk and time)
  growing_season: [5, 10]               # months (May-October) of the yearly mean / anomaly
  min_gs_obs: 2                         # observed growing-season months a year needs for its yearly mean / max
  min_year_obs: 5                       # observed months (whole year) a year needs for a phenology fit
  mask_classes: [cloud, shadow, snow_cover, ice_cover, open_water]   # months whose class composite is one of these are dropped (an index under snow is not vegetation)
  phenology:
    enabled: true                       # peak month/value, amplitude, season start / end / length (day of year), per year
    sos_fraction: 0.5                   # season start/end = curve crossing low + fraction * (peak - low)
    baseline_percentile: 10.0           # `low` = this percentile of all the pixel's observations
    min_amplitude: 0.08                 # peak - low below this = no seasonal cycle that year
    max_gap_months: 2                   # refuse to interpolate across more unobserved months than this
    trends: true                        # also a trend on the yearly season start / end / length (needs trend.enabled)
  trend:
    enabled: true                       # Theil-Sen slope + Mann-Kendall (S, p) of the yearly series: slow greening / browning
    series: [growing_season_mean, annual_max]
    min_years: 8
    since_last_break: true              # also fitted on the years after each pixel's latest Stage 09 break
  anomalies:
    enabled: true                       # monthly z-score against the pixel's own climatology, reduced per year
    robust: true                        # median / MAD instead of mean / std
    baseline_years: null                # [first_year, last_year] the climatology is computed on; null = every year
    min_clim_obs: 5
    min_scale: 0.02                     # floor of the scale (avoids huge z on very stable pixels)
    extreme_z: 2.0                      # |z| beyond this = extreme month
    store_monthly: false                # also write the full monthly z cube (large: n_months x H x W float16)
  variability:
    enabled: true                       # coefficient of variation and mean year-to-year change of the yearly series
    min_years: 5

# ----------------------------------------------------------------------
# Recovery analysis (script 14): how the land comes back after each named
# event of script 12 (event_typing). Data tables, one row per event.
# Needs the monthly cube of vegetation_dynamics (same run); DEM is optional.
# ----------------------------------------------------------------------
recovery_analysis:
  enabled: true
  output_root: outputs/recovery_analysis
  overwrite: false
  index: NDVI                           # must be in vegetation_dynamics.indices
  event_types: [fire, cutblock, permanent_clearing, canopy_decline, other_loss]   # from event_typing (gain is left out)
  curves:
    enabled: true                       # yearly index after each event relative to the pre-event baseline; recovery time, trough, rate
    max_years: 20                       # years after the break year kept in the curve
    pre_years: 3                        # baseline = median of this many years before the break year
    min_pre_years: 2
    recovery_threshold: 0.8             # recovered = back to this share of the baseline...
    sustain_years: 2                    # ... for this many observed years in a row
  succession:
    enabled: true                       # dominant class of each growing season after the event; Markov + class-share tables
    max_years: 20
    min_season_obs: 2
    forest_class: forest
  factors:
    enabled: true                       # event table joined with terrain (DEM) + severity; binned summary (needs curves)
    elevation_bins_m: [0, 500, 1000, 1500, 2000, 4000]
    slope_bins_deg: [0, 5, 15, 30, 90]
    aspect_sectors: 8
    min_group_size: 5                   # smaller groups are left out of the binned summary
