# Conda environment for the geospatial stack. GDAL/rasterio/pyproj are much
# more reliably installed via conda-forge than pip on Windows.
#
# Every version below is pinned exactly to what this pipeline is actually
# developed and tested against (see `conda list` on the working machine) --
# not a floor. A fresh install elsewhere resolving newer versions has broken
# compatibility before (e.g. zarr 3.x's codec API change), so exact pins are
# load-bearing here, not just reproducibility hygiene.
#
# Usage:
#   conda env create -f environment.yml
#   conda activate landscape-change-detection-pipeline
#   pip install -r requirements-torch.txt
#   pip install -e .
name: landscape-change-detection-pipeline
channels:
  - conda-forge
dependencies:
  - python=3.11.16
  - gdal=3.12.3
  - rasterio=1.4.4
  - rioxarray=0.19.0
  - xarray=2026.7.0
  - geopandas=1.1.4
  - shapely=2.1.2
  - pyproj=3.7.2
  - affine=3.0.1
  # zarr 3.x replaced numcodecs.Blosc(...) compressor objects with a new
  # config-based codec pipeline; pinned to the 2.x line until the pipeline's
  # zarr writers are ported to the v3 codec API (see glacier-fsnow-unet's own
  # pin note).
  - zarr=2.18.7
  - numcodecs=0.15.1
  - numpy=2.4.6
  - pandas=3.0.5
  - scikit-learn=1.9.1
  # pandas' to_parquet/read_parquet need an engine at runtime; pandas itself
  # does not pull one in as a dependency. Tile/scene registries and split
  # assignments are all Parquet, so this is load-bearing.
  # On Windows, importing rasterio before pyarrow can break pyarrow's native
  # extensions via DLL search-order conflicts; tests/conftest.py works around
  # this by importing pyarrow first, before any test module loads rasterio.
  - pyarrow=25.0.0
  - scipy=1.17.1
  - joblib=1.6.0
  # PNG export for scene RGB Raw/Shadow QA composites (scenes/composites.py).
  - pillow=12.3.0
  - pyyaml=6.0.3
  - tqdm=4.70.1
  - pytest=9.1.1
  - earthengine-api=1.7.43
  # scripts/export_gui.py -- on-demand browse/preview/export GUI for this
  # pipeline's .npz rasters.
  - streamlit=1.59.1
  - matplotlib=3.11.2
  # Per-pixel temporal segmentation kernel (change/segmentation.py) --
  # JIT-compiled, parallelised across pixels.
  - numba=0.67.0
  - pip
  - pip:
      - python-dotenv==1.2.3
      - pydantic==2.13.5
