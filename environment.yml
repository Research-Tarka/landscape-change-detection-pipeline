# Conda environment for the geospatial stack. GDAL/rasterio/pyproj are much
# more reliably installed via conda-forge than pip on Windows.
#
# Usage:
#   conda env create -f environment.yml
#   conda activate landscape-change-detection-pipeline
#   pip install -r requirements-torch.txt
#   pip install -e .
name: landscape-change-detection-pipeline
channels:
  - conda-forge
dependencies:
  - python=3.11
  - gdal>=3.7
  - rasterio>=1.3
  - rioxarray>=0.15
  - xarray>=2023.6
  - geopandas>=0.14
  - shapely>=2.0
  - pyproj>=3.6
  - affine>=2.4
  # zarr 3.x replaced numcodecs.Blosc(...) compressor objects with a new
  # config-based codec pipeline; pinned <3 until the pipeline's zarr writers
  # are ported to the v3 codec API (see glacier-fsnow-unet's own pin note).
  - zarr>=2.16,<3
  - numcodecs>=0.12
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  # pandas' to_parquet/read_parquet need an engine at runtime; pandas itself
  # does not pull one in as a dependency. Tile/scene registries and split
  # assignments are all Parquet, so this is load-bearing.
  # On Windows, importing rasterio before pyarrow can break pyarrow's native
  # extensions via DLL search-order conflicts; tests/conftest.py works around
  # this by importing pyarrow first, before any test module loads rasterio.
  - pyarrow>=14.0
  - scipy>=1.11
  - joblib>=1.3
  # PNG export for scene RGB Raw/Shadow QA composites (scenes/composites.py).
  - pillow>=10.0
  - pyyaml>=6.0
  - tqdm>=4.65
  - pytest>=7.4
  - earthengine-api>=1.1
  # scripts/export_gui.py -- on-demand browse/preview/export GUI for this
  # pipeline's .npz rasters.
  - streamlit>=1.30
  - matplotlib>=3.7
  - pip
  - pip:
      - python-dotenv>=1.0
      - pydantic>=2.5
      # Local CCDC/COLD change detection (change/ccdc.py) -- the actively
      # maintained successor to pycold; not on conda-forge. See
      # docs/decisions/change_detection_algorithm_choice.md.
      - pyxccd>=1.1
